<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SIMON | SENSOR SCHOOL</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#f6f8fa}header{background:#0b3d91;color:#fff;padding:18px;position:sticky;top:0} .wrap{max-width:980px;margin:auto;padding:12px}.crumbs{display:flex;gap:6px;background:#fff;border:1px solid #d0d7de;padding:10px;border-radius:8px;margin:12px 0}.crumbs span{cursor:pointer;color:#0969da}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.item{background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:16px;text-align:center;cursor:pointer}.item:hover{border-color:#0b3d91}.file-list{background:#fff;border:1px solid #d0d7de;border-radius:10px}.file-row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #eee}.empty{background:#fff;border:1px dashed #ccc;border-radius:12px;padding:20px;text-align:center;margin-top:12px}</style></head><body>
<header><h1>SIMON — SENSOR SCHOOL</h1><p>Everything under SIMON • olagunju-simon.github.io/Simon/</p></header>
<div class="wrap"><div id="crumbs" class="crumbs"></div><h2 id="curName" style="margin:10px">SENSOR SCHOOL</h2><button onclick="goUp()" id="backBtn">← Back</button><div id="loading">Loading folders...</div><div id="grid" class="grid"></div><div id="files" class="file-list"></div><div id="empty" class="empty"></div>
<div class="empty" style="text-align:left;margin-top:15px"><b>How to add:</b><br>1. Click ... > Add file > Create new file<br>2. Name: SSS1/Biology/Chapter1.pdf<br>GitHub makes folders. Commit. Refresh site!</div></div>
<script>
const USER="Olagunju-Simon",REPO="Simon",BRANCH="main";let pathStack=[];
function apiUrl(p){return `https://api.github.com/repos/${USER}/${REPO}/contents${p?'/'+p:''}?ref=${BRANCH}`}
function rawUrl(p){return `https://${USER}.github.io/${REPO}/${p}`}
async function loadPath(){const path=pathStack.join("/");document.getElementById("loading").style.display="block";try{const r=await fetch(apiUrl(path));const data=await r.json();render(data,path)}catch(e){if(pathStack.length==0){renderVirtual() } }document.getElementById("loading").style.display="none";renderCrumbs()}
function render(data,curPath){const grid=document.getElementById("grid"),filesDiv=document.getElementById("files");grid.innerHTML="";filesDiv.innerHTML="";const folders=data.filter(d=>d.type==="dir"),files=data.filter(d=>d.type==="file"&&!["readme.md","index.html"].includes(d.name.toLowerCase()));folders.forEach(f=>{const el=document.createElement("div");el.className="item";el.innerHTML=`📁<br><b>${f.name}</b>`;el.onclick=()=>{pathStack.push(f.name);loadPath()};grid.appendChild(el)});files.forEach(f=>{const row=document.createElement("div");row.className="file-row";row.innerHTML=`<a href="${rawUrl(curPath?curPath+'/'+f.name:f.name)}" target="_blank">${f.name}</a><span>${(f.size/1024).toFixed(1)}KB</span>`;filesDiv.appendChild(row)})}
function renderVirtual(){const grid=document.getElementById("grid");grid.innerHTML="";[{n:"SENSOR SCHOOL",p:["SENSOR SCHOOL"]},{n:"SSS1",p:["SSS1"]},{n:"SSS2",p:["SSS2"]},{n:"SSS3",p:["SSS3"]}].forEach(v=>{const el=document.createElement("div");el.className="item";el.innerHTML=`📁<br><b>${v.n}</b><br><small>Tap</small>`;el.onclick=()=>{pathStack=v.p;loadPath()};grid.appendChild(el)});document.getElementById("empty").innerHTML="Your repo is new. Create folder SSS1/Biology to see it here. Demo shown for now."}
function renderCrumbs(){const c=document.getElementById("crumbs");c.innerHTML="";["SIMON",...pathStack].forEach((p,i)=>{const s=document.createElement("span");s.textContent=p;s.onclick=()=>{if(i==0)pathStack=[];else pathStack=pathStack.slice(0,i);loadPath()};c.appendChild(s);if(i<pathStack.length)c.appendChild(document.createTextNode(" / "))});document.getElementById("curName").textContent=pathStack.length?pathStack[pathStack.length-1]:"SENSOR SCHOOL (All under SIMON)";document.getElementById("backBtn").style.display=pathStack.length?"block":"none"}
function goUp(){pathStack.pop();loadPath()}loadPath();
</script></body></html>
